exclude: "^(node_modules/|frappe-semgrep-rules/|[.]vscode/|.*/node_modules/|zra_vfms/public/dist/)"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "zra_vfms.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-yaml
      - id: no-commit-to-branch
        args:
          - --branch
          - main
          - --branch
          - master
          - --branch
          - production
          - --branch
          - version-14
          - --branch
          - version-15
          - --branch
          - version-16
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]
        files: '^zra_vfms/.*\.py$'

      - id: ruff
        name: "Run ruff linter"
        args: ["--fix"]
        files: '^zra_vfms/.*\.py$'

      - id: ruff-format
        name: "Run ruff formatter"
        files: '^zra_vfms/.*\.py$'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                zra_vfms/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                zra_vfms/templates/includes/.*|
                zra_vfms/public/js/lib/.*
            )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                zra_vfms/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                zra_vfms/templates/includes/.*|
                zra_vfms/public/js/lib/.*
            )$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: local
    hooks:
      - id: frappe-semgrep-rules
        name: "Frappe Semgrep Security Rules"
        entry: bash -c 'if [ ! -d frappe-semgrep-rules/.git ]; then rm -rf frappe-semgrep-rules && GIT_TEMPLATE_DIR="" git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules; fi && semgrep scan --config ./frappe-semgrep-rules/rules --config r/python.lang.security --severity=ERROR --error --quiet "$@"' --
        language: python
        additional_dependencies: ["semgrep"]
        types: [python]
        files: '^zra_vfms/.*\.py$'
        pass_filenames: true
        require_serial: true

      - id: full-repository-check
        name: "Full repository check before push"
        entry: bash -c 'if command -v pre-commit >/dev/null 2>&1; then exec pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure --color=always; else exec python3 -m pre_commit run --all-files --hook-stage pre-commit --show-diff-on-failure --color=always; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true

ci:
    autoupdate_schedule: weekly
    skip: [frappe-semgrep-rules, full-repository-check]
    submodules: false
