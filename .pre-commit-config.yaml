exclude: "node_modules|.git"
default_stages: [pre-commit, manual]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "zra_vfms.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-yaml
      - id: no-commit-to-branch
        args: ["--branch", "version-15", "--branch", "version-15-hotfix", "--branch", "version-16", "--branch", "version-16-hotfix"]
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: ["--line-length", "110"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                zra_vfms/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                zra_vfms/templates/includes/.*|
                zra_vfms/public/js/lib/.*
            )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                zra_vfms/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                zra_vfms/templates/includes/.*|
                zra_vfms/public/js/lib/.*
            )$

  # Frappe Semgrep security rules (local hook — repo has no .pre-commit-hooks.yaml)
  - repo: local
    hooks:
      - id: frappe-semgrep-rules
        name: "Frappe Semgrep Security Rules"
        entry: bash -c 'if [ ! -d frappe-semgrep-rules/.git ]; then rm -rf frappe-semgrep-rules && GIT_TEMPLATE_DIR="" git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules; fi && semgrep scan --config ./frappe-semgrep-rules/rules --config r/python.lang.security --error --quiet "$@"' --
        language: system
        types: [python]
        pass_filenames: true

ci:
    autoupdate_schedule: weekly
    skip: [frappe-semgrep-rules]
    submodules: false
